---
# By default this config loads hd-driver-podman from the remote driver
# registry. To use a pre-fetched local binary instead, load this repo with:
#
# repos:
#   - repo: <this repo>
#     options:
#       use_local_binary: true
#
# Optional repo options for the remote case:
#   registry: override the named registry (default: charles-gh-pages)
#   channel: override the release channel (default: stable)
#   version: pin an exact release version
drivers:
  daemon:
    features:
      operator:
        - name: "driver:podman"
    drivers:
      podman:
        name: podman
        type: '{% if .options.use_local_binary %}builtin{% else %}remote{% end %}'
        handlerData:
{% if .options.use_local_binary %}
          shortName: hd-driver-podman
{% else %}
          registry: '{% default "charles-gh-pages" .options.registry %}'
          channel: '{% default "stable" .options.channel %}'
{% if .options.version %}
          version: '{% .options.version %}'
{% end %}
          requiredPackages:
            apk:
              - gpgme
            apt:
              - libgpgme11
            dnf:
              - gpgme
            brew:
              - gpgme
{% end %}

systems:
  podman:
    functions:
      create_pod:
        driver: podman
        rawAction: create_pod
        parameters:
          pod_spec: $?ctx.podman_pod_spec
          containers: $?ctx.podman_containers
          uri: $?sysData.uri
          identity: $?sysData.identity
          with_work_volume: $?ctx.podman_with_work_volume
          use_work_volume: $?ctx.podman_use_work_volume
          work_volume_mount_point: $?ctx.podman_work_volume_mount_point
        export:
          podman_pod_id: $?data.pod_id
          _log_stream:
            pod_id: $?data.pod_id
            provider: podman
            gh_slug: '{{ resolve_gh_slug .ctx.gh_slug .ctx.git_repo .event.json.repository.full_name }}'
            stream_token: '{{ sign_pod_id .data.pod_id (resolve_gh_slug .ctx.gh_slug .ctx.git_repo .event.json.repository.full_name) }}'
      start_pod:
        driver: podman
        rawAction: start_pod
        parameters:
          pod_id: $ctx.podman_pod_id
          uri: $?sysData.uri
          identity: $?sysData.identity
      wait_pod:
        driver: podman
        rawAction: wait_pod
        parameters:
          pod_id: $ctx.podman_pod_id
          uri: $?sysData.uri
          identity: $?sysData.identity
      get_pod_log:
        driver: podman
        rawAction: get_pod_log
        parameters:
          pod_id: $ctx.podman_pod_id
          uri: $?sysData.uri
          identity: $?sysData.identity
          delete_on_success: '{{ empty .ctx.podman_delete_on_success | not | return }}'
        export:
          podman_pod_log: $data.all,""
      create_volume:
        driver: podman
        rawAction: create_volume
        parameters:
          name: $?ctx.podman_volume_name
          ignore_if_exists: '{{ empty .ctx.podman_volume_ignore_if_exists | not | return }}'
          volume_spec: $?ctx.podman_volume_spec
          uri: $?sysData.uri
          identity: $?sysData.identity
        export_on_success:
          podman_volume_name: $data.volume_name
      delete_volume:
        driver: podman
        rawAction: delete_volume
        parameters:
          volume_name: $ctx.podman_volume_name
          force: $?ctx.podman_volume_force
          uri: $?sysData.uri
          identity: $?sysData.identity

workflows:
  run_podman:
    meta:
      description: >-
        Run one or more containers as a Podman pod. All containers except the last run as init
        containers (executed sequentially to completion in order); the last container is the main
        container. Returns the combined stdout/stderr log output of all containers.
      inputs:
        - name: podman_containers
          type: object
          description: >-
            Required. Ordered list of container specifications. Each entry must have an 'image'
            field and may include 'command' (list), 'env' (key/value object), 'name', 'mounts',
            'imagePullPolicy' (Always/Never/IfNotPresent), and other Podman SpecGenerator fields.
            All containers except the last are treated as init containers.
        - name: podman_pod_spec
          type: object
          description: >-
            Optional pod-level configuration object (Podman PodSpecGenerator fields, e.g. resource
            limits, DNS settings). Omit for defaults.
        - name: podman_with_work_volume
          description: >-
            Set to 'true' to create an ephemeral shared volume and mount it to all containers at
            the path given by podman_work_volume_mount_point (default /local/honeydipper).
        - name: podman_use_work_volume
          description: >-
            Optionally, give the name of an existing volume instead of an ephemeral volume to
            mount as a shared volume to all containers at the path given by
            podman_work_volume_mount_point.
        - name: podman_work_volume_mount_point
          description: >-
            Mount path for the shared work volume inside each container. Defaults to
            /local/honeydipper. Only used when podman_with_work_volume is true.
        - name: podman_delete_on_success
          description: Set to 'true' to delete the pod after it exits successfully.
    with:
      podman_system-: podman
    steps:
    - call_function: '{{ .ctx.podman_system}}.create_pod'
      export:
        podman_error: $?labels.reason
      export_on_error:
        podman_error: $labels.reason
      with:
        hooks:
          on_success: $?ctx.podman_on_start
    - on_error: continue
      steps:
        - call_function: '{{ .ctx.podman_system}}.start_pod'
          export:
            podman_error: $?ctx.podman_error,labels.reason
          export_on_error:
            podman_error: $ctx.podman_error,labels.reason
        - call_function: '{{ .ctx.podman_system}}.wait_pod'
          export:
            podman_error: $?ctx.podman_error,labels.reason
          export_on_error:
            podman_error: $ctx.podman_error,labels.reason
        - call_function: '{{ .ctx.podman_system}}.get_pod_log'
          export:
            podman_error: $?ctx.podman_error,labels.reason
            _output: $data.all,""
          export_on_error:
            podman_error: $ctx.podman_error,labels.reason

  create_podman_volume:
    meta:
      description: >-
        Create a named Podman volume for persistent storage. The volume persists across pod runs
        and can be mounted into any run_podman call via podman_use_work_volume. Returns the volume
        name, which is required for mounting or later deletion.
      inputs:
        - name: podman_volume_name
          description: >-
            Desired name for the volume. If omitted, Podman auto-generates a name. Store the
            returned name to mount or delete the volume later.
        - name: podman_volume_ignore_if_exists
          description: >-
            Set to 'true' to succeed silently when a volume with this name already exists, instead
            of returning an error. Useful for idempotent setup.
        - name: podman_volume_spec
          type: object
          description: >-
            Optional volume configuration (VolumeCreateOptions fields): 'Driver' (string, default
            'local'), 'Label' (key/value object), 'Options' (driver-specific key/value object).
    with:
      podman_system-: podman
    call_function: '{{ .ctx.podman_system}}.create_volume'
    export:
      _output: $ctx.podman_volume_name

  delete_podman_volume:
    meta:
      description: >-
        Delete a named Podman volume. Use this to free storage after the data is no longer needed.
      inputs:
        - name: podman_volume_name
          description: Required. Name of the volume to delete.
        - name: podman_volume_force
          description: >-
            Set to 'true' to delete the volume even if it is currently in use by a container.
    with:
      podman_system-: podman
    call_function: '{{ .ctx.podman_system}}.delete_volume'
    export:
      _output: $ctx.podman_volume_name

  run_script:
    meta:
      description: >-
        Run a script in a container with automatic vault-based secret injection.
        An init container installs the vault secret driver into a shared work volume,
        and the script container runs with that driver as its entrypoint to transparently
        resolve any 'hd-lookup:' values in environment variables. Use this instead of
        run_podman when the script needs authenticated access to vault-stored secrets,
        such as GitHub tokens or API keys.
      inputs:
        - name: script_image
          description: Required. Container image to run the script in.
        - name: script_command
          description: >-
            Required. Shell script or command string to execute. Runs via '/bin/sh -c'
            inside the container.
        - name: script_env
          type: object
          description: >-
            Optional key/value map of environment variables for the script container.
            Values prefixed with 'hd-lookup:' are transparently resolved via vault
            before the script starts.
        - name: script_volumes
          type: object
          description: >-
            Optional list of extra volumes to mount in the script container. Each
            entry should be an object with 'name' (volume name) and 'dest' (mount path).
        - name: podman_use_work_volume
          description: >-
            Optional name of an existing named volume to reuse as the shared work
            volume (mounted at /local/honeydipper). If omitted, a new ephemeral
            volume is created automatically and deleted when the pod finishes.
        - name: podman_delete_on_success
          description: Set to 'true' to automatically delete the pod after successful exit.
    with:
      podman_system-: podman
      podman_with_work_volume: '{{ if empty .ctx.podman_use_work_volume }}true{{ end }}'
      worker_profile-: $ctx.hdci.workers.{{ .ctx.hdci.worker_default }},ctx.hdci.workers.podman_default
    steps:
      - export:
          podman_containers:
            - image: $ctx.hdci.worker.identity.sec_driver_image
              entrypoint:
                - /bin/sh
                - -c
              env:
                SEC_DRIVER: $ctx.hdci.worker.identity.sec_driver
                WORK_DIR: '{{ coalesce .ctx.hdci.worker.work_dir "/local/honeydipper" }}'
              command:
                - >-
                  cp $SEC_DRIVER $(dirname $SEC_DRIVER)/docker-entrypoint.sh
                  $(dirname $SEC_DRIVER)/web "$WORK_DIR" && echo sec driver copied.
            - image: $ctx.script_image
              entrypoint:
                - '{{ coalesce .ctx.hdci.worker.work_dir "/local/honeydipper" }}/docker-entrypoint.sh'
              command:
                - /bin/sh
                - -c
                - $ctx.script_command
              env: '{{ merge (default (dict) .ctx.hdci.worker.identity.env | deepCopy) (default (dict) .ctx.worker_profile.identity.setup.env | deepCopy) (default (dict) .ctx.script_env | deepCopy) | return }}'
              volumes: '{{ concat (default (list) .ctx.worker_profile.identity.setup.volumes) (default (list) .ctx.script_volumes) | return }}'
      - call_workflow: run_podman

  check_slack_interact:
    call_workflow: slack_ask
    with:
      blocks:
        - type: section
          text:
            type: mrkdwn
            text: "Let's test the slack interact!"
